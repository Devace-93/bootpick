[package]
name = "bootpick"
version = "0.1.0"
edition = "2021"
description = "A mouse-driven, themeable UEFI boot picker"
license = "MIT"

[dependencies]
uefi = { version = "0.41", features = ["alloc", "global_allocator", "panic_handler", "logger"] }
log = { version = "0.4", default-features = false }
ab_glyph = { version = "0.2", default-features = false, features = ["libm"] }
libm = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
panic = "abort"
opt-level = 1
