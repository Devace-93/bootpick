[package]
name = "bootpick-config"
version = "0.2.0"
edition = "2021"
description = "Desktop settings app for bootpick: live preview, themes, logos, backgrounds, enable/disable and uninstall"
license = "MIT"

[[bin]]
name = "bootpick-config"
path = "src/main.rs"

[dependencies]
bootpick-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The icon and file properties of the Windows program (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
# Packs the boot menu files into the single-file installer.
flate2 = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
