[package]
name = "bootpick-config"
version = "0.2.0"
edition = "2021"
description = "Desktop settings app for bootpick: live preview, themes, logos, backgrounds, enable/disable and uninstall"
license = "MIT"

[[bin]]
name = "bootpick-config"
path = "src/main.rs"

[dependencies]
bootpick-core = { path = "../core" }
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
