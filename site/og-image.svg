<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background and text of og-image.png; the menu screenshot (img/menu.webp)
       is composited on the right by tools/build-og.py. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121a2b"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.75" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g transform="translate(64 80) scale(0.75)">
    <rect x="6" y="6" width="116" height="116" rx="26" fill="#1e293b" stroke="#334155" stroke-width="3"/>
    <rect x="24" y="30" width="34" height="34" rx="8" fill="#38bdf8"/>
    <rect x="70" y="30" width="34" height="34" rx="8" fill="#f1f5f9" opacity=".25"/>
    <rect x="24" y="72" width="34" height="34" rx="8" fill="#f1f5f9" opacity=".25"/>
    <rect x="70" y="72" width="34" height="34" rx="8" fill="#f1f5f9" opacity=".25"/>
  </g>
  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Cantarell, 'Noto Sans', sans-serif" fill="#ececf1">
    <text x="64" y="270" font-size="84" font-weight="800" letter-spacing="-2">bootpick</text>
    <text x="66" y="338" font-size="30" font-weight="600" fill="#a0a0ad">A boot menu you can click,</text>
    <text x="66" y="384" font-size="30" font-weight="600" fill="#a0a0ad">for every system on your PC</text>
    <g font-size="22" font-weight="600">
      <rect x="66" y="424" width="132" height="42" rx="21" fill="#1b1e27" stroke="#2a2b33"/>
      <text x="132" y="452" text-anchor="middle">UEFI</text>
      <rect x="210" y="424" width="234" height="42" rx="21" fill="#1b1e27" stroke="#2a2b33"/>
      <text x="327" y="452" text-anchor="middle">Windows · Linux</text>
    </g>
    <text x="66" y="550" font-size="28" font-weight="600" fill="#38bdf8">bootpick.3m4.net</text>
  </g>
</svg>
